name: Omega Entropy One Bit

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: omega-entropy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify one-bit model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: sh -n omega_entropy_one_bit.sh

      - name: Verify state model and negative controls
        run: python3 tests/verify_entropy_model.py

      - name: Run eight finite rounds
        run: sh omega_entropy_one_bit.sh 8

      - name: Write verification summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Model checks passed: one physical line below 2 KiB; both bit branches;
          reversible encoding; preserved OMEGA core; one RNG call per run;
          biased distributions and merged states rejected.

          H_MODEL_BITS = 1 assumes one fair bit, sampled once and reused.
          This verifies the specified state model, not physical RNG entropy.
          SUMMARY
