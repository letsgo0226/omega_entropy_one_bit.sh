name: ATGC Managed QTM Recurrence

on:
  repository_dispatch:
    types: [atgc-reconcile]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atgc-managed-${{ github.repository }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify 2 KB QTM recurrence
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < lfp_atgc_tm_2kb.sh)" -eq 1
          test "$(wc -c < lfp_atgc_tm_2kb.sh)" -lt 2048
          sh -n lfp_atgc_tm_2kb.sh
          sh lfp_atgc_tm_2kb.sh > atgc-certificate.json
          python3 - <<'PY'
          import json
          x=json.load(open("atgc-certificate.json"))
          assert x["protocol"]=="HSI-COSMIC-QUANTUM-SELF-CLOSURE/QTM-1.0"
          assert all(x[k] is True for k in ("transition_verified","norm_preserved","U2_identity","two_step_quantum_recurrence"))
          assert x["measurement"]=="none"
          print("QTM_RECURRENCE_VERIFIED=1; scope=specified two-state TM only")
          PY
